# ~/.tmux.conf — basic, dependency-free config

# --- Prefix ---
# Ctrl-a is easier on the pinky than Ctrl-b (and matches screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor
set -g mouse on
set -g history-limit 50000
set -s escape-time 10                       # no lag when hitting Esc in nvim
set -g focus-events on                      # nvim autoread / gitsigns
set -g display-time 2000

# --- Windows & panes ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# split in the current pane's directory, with mnemonic keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# --- Seamless nvim <-> tmux pane navigation (vim-tmux-navigator) ---
# C-hjkl moves between tmux panes, EXCEPT when the pane is running nvim: then
# the key is forwarded so nvim moves between its own splits first.
# Needs christoomey/vim-tmux-navigator on the nvim side (see nvim/lua/custom/plugins/).
# NOTE: the regex deliberately avoids backslash escapes (\S, \.) -- tmux strips
# backslashes inside "..." and the pattern silently stops matching.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +([^ ]*/)?g?[.]?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# ...and the same keys inside copy mode, where nvim is never in the way
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# C-l now belongs to tmux, so clear-screen moves onto the prefix
bind C-l send-keys 'C-l'

# plain prefix + hjkl still selects panes, in case C-hjkl is swallowed
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes (repeatable: hold the key after the prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode (vi keys, copies to the macOS clipboard) ---
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# --- Reload ---
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Status bar ---
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default fg=colour245"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour245]%a %d %b  #[fg=colour39]%H:%M "
set -g status-right-length 60
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=colour39,bold] #I #W #[default]"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
set -g message-style "bg=colour39 fg=black"
